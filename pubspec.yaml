name: begateway_flutter_sdk
description: sdk for payments using beGateway
version: 0.0.1
homepage: https://github.com/begateway/begateway-flutter-sdk

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=1.17.0"

# Ядро SDK: запросы, состояние, модели, переводы, абстрактное
# хранилище (StorageService). UI (страницы, виджеты, ассеты) и
# реализация хранилища живут в example — ядро от них не зависит.
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
